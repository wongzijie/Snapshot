<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot capture workflow</title>
  <desc id="desc">Use a hotkey, select a window or region, adjust it, then copy or save.</desc>
  <rect width="1100" height="220" rx="24" fill="#F6F8FA"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g transform="translate(40 42)">
      <rect width="190" height="136" rx="18" fill="#fff" stroke="#D8DEE4"/>
      <circle cx="95" cy="45" r="24" fill="#E8F8EF"/>
      <text x="95" y="52" font-size="23" fill="#07A952">⌨</text>
      <text x="95" y="91" font-size="16" font-weight="700" fill="#17202A">1. 按下快捷键</text>
      <text x="95" y="116" font-size="13" fill="#667085">复制或保存模式</text>
    </g>
    <path d="M242 110h48" stroke="#AAB4BC" stroke-width="2"/>
    <path d="M282 102l10 8-10 8" fill="none" stroke="#AAB4BC" stroke-width="2"/>
    <g transform="translate(302 42)">
      <rect width="190" height="136" rx="18" fill="#fff" stroke="#D8DEE4"/>
      <rect x="65" y="21" width="60" height="48" rx="5" fill="#EDF1F4" stroke="#07C160" stroke-width="2"/>
      <text x="95" y="91" font-size="16" font-weight="700" fill="#17202A">2. 选择内容</text>
      <text x="95" y="116" font-size="13" fill="#667085">窗口或自由区域</text>
    </g>
    <path d="M504 110h48" stroke="#AAB4BC" stroke-width="2"/>
    <path d="M544 102l10 8-10 8" fill="none" stroke="#AAB4BC" stroke-width="2"/>
    <g transform="translate(564 42)">
      <rect width="190" height="136" rx="18" fill="#fff" stroke="#D8DEE4"/>
      <rect x="64" y="20" width="62" height="50" rx="4" fill="#F6F8FA" stroke="#07C160" stroke-width="2"/>
      <circle cx="64" cy="20" r="4" fill="#fff" stroke="#07C160"/>
      <circle cx="126" cy="70" r="4" fill="#fff" stroke="#07C160"/>
      <text x="95" y="91" font-size="16" font-weight="700" fill="#17202A">3. 调整选区</text>
      <text x="95" y="116" font-size="13" fill="#667085">移动或缩放</text>
    </g>
    <path d="M766 110h48" stroke="#AAB4BC" stroke-width="2"/>
    <path d="M806 102l10 8-10 8" fill="none" stroke="#AAB4BC" stroke-width="2"/>
    <g transform="translate(826 42)">
      <rect width="234" height="136" rx="18" fill="#17202A"/>
      <rect x="28" y="25" width="82" height="34" rx="9" fill="#07C160"/>
      <text x="69" y="47" font-size="13" font-weight="700" fill="#fff">剪贴板</text>
      <rect x="124" y="25" width="82" height="34" rx="9" fill="#2F3D48"/>
      <text x="165" y="47" font-size="13" font-weight="700" fill="#fff">JPG</text>
      <text x="117" y="91" font-size="16" font-weight="700" fill="#fff">4. 直接输出</text>
      <text x="117" y="116" font-size="13" fill="#A9B5BF">无需保存对话框</text>
    </g>
  </g>
</svg>
