<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot Windows screenshot tool</title>
  <desc id="desc">A dark hero banner showing Snapshot's window and region capture modes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#1D2933"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="42" r="210" fill="#07C160" opacity=".08"/>
  <circle cx="110" cy="400" r="180" fill="#1677FF" opacity=".06"/>

  <g transform="translate(72 76)">
    <rect width="74" height="74" rx="19" fill="#07C160"/>
    <path d="M20 33V20h13M54 33V20H41M20 41v13h13M54 41v13H41" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="170" y="111" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="44" font-weight="700">Snapshot</text>
  <text x="74" y="190" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="31" font-weight="650">Fast screenshots. Zero dialogs.</text>
  <text x="74" y="234" fill="#A9B5BF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">Smart window selection · Free-form regions · Clipboard or JPG</text>

  <g transform="translate(74 283)">
    <rect width="206" height="48" rx="12" fill="#07C160"/>
    <text x="103" y="31" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Ctrl + Alt + A</text>
    <text x="222" y="31" fill="#A9B5BF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Copy</text>
    <rect x="318" width="206" height="48" rx="12" fill="#27343E" stroke="#42515C"/>
    <text x="421" y="31" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Ctrl + Alt + S</text>
    <text x="540" y="31" fill="#A9B5BF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Save JPG</text>
  </g>

  <g transform="translate(790 70)" filter="url(#shadow)">
    <rect width="330" height="270" rx="18" fill="#242F38" stroke="#44525D" stroke-width="2"/>
    <rect x="20" y="22" width="290" height="32" rx="8" fill="#182129"/>
    <circle cx="40" cy="38" r="6" fill="#FF5F57"/>
    <circle cx="61" cy="38" r="6" fill="#FFBD2E"/>
    <circle cx="82" cy="38" r="6" fill="#28C840"/>
    <rect x="36" y="78" width="242" height="146" fill="#162027" stroke="#07C160" stroke-width="3"/>
    <rect x="31" y="73" width="10" height="10" fill="#fff" stroke="#07C160"/>
    <rect x="273" y="219" width="10" height="10" fill="#fff" stroke="#07C160"/>
    <rect x="139" y="62" width="72" height="25" rx="6" fill="#11181E"/>
    <text x="175" y="80" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="12">242 × 146</text>
    <rect x="179" y="234" width="105" height="26" rx="7" fill="#07C160"/>
    <text x="231" y="252" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">COPY · ENTER</text>
  </g>
</svg>
