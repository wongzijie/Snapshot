name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\Snapshot.csproj

      - name: Build
        run: dotnet build .\Snapshot.csproj -c Release --no-restore

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          dotnet publish .\Snapshot.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish

      - name: Package Windows release
        id: package
        shell: pwsh
        run: |
          Copy-Item -LiteralPath .\README.md -Destination .\publish\使用说明.md

          if ("${{ github.ref_type }}" -eq "tag") {
            $assetName = "Snapshot-${{ github.ref_name }}-win-x64.zip"
          } else {
            $assetName = "Snapshot-win-x64.zip"
          }

          $archivePath = Join-Path $PWD $assetName
          Compress-Archive `
            -LiteralPath .\publish\Snapshot.exe, .\publish\使用说明.md `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          $checksumPath = "$archivePath.sha256"
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Snapshot-win-x64
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assetPath = "${{ steps.package.outputs.asset_path }}"
          $checksumPath = "${{ steps.package.outputs.checksum_path }}"
          $notesPath = ".\docs\releases\$tag.md"

          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $assetPath $checksumPath `
              --repo "${{ github.repository }}" `
              --clobber
          } elseif (Test-Path -LiteralPath $notesPath) {
            gh release create $tag $assetPath $checksumPath `
              --repo "${{ github.repository }}" `
              --verify-tag `
              --title "Snapshot $tag" `
              --notes-file $notesPath
          } else {
            gh release create $tag $assetPath $checksumPath `
              --repo "${{ github.repository }}" `
              --verify-tag `
              --title "Snapshot $tag" `
              --generate-notes
          }
