name: Bug report
description: 报告可复现的 Snapshot 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认问题可以在最新版本复现。

  - type: input
    id: version
    attributes:
      label: Snapshot 版本
      placeholder: 例如 v1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？你原本期望什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 Snapshot
        2. 按下……
        3. 选择……
    validations:
      required: true

  - type: textarea
    id: displays
    attributes:
      label: 显示器与缩放
      description: 请说明显示器数量、分辨率和 Windows 缩放比例。
      placeholder: 1 台，2560×1440，125%

  - type: textarea
    id: conflicts
    attributes:
      label: 可能冲突的软件
      description: 是否运行微信、QQ、PowerToys、显卡工具或其他截图软件？

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除截图和日志中的个人信息。
          required: true
